# Beispielkonfiguration für die Beispieldateien in data/sample/.
# Kopieren Sie diese Datei, passen Sie die Listen an und ordnen Sie die Spalten Ihrer eigenen Exporte zu.

[phone]
default_country_code = "49"            # Nummern, die mit 0 beginnen, erhalten diese Landesvorwahl (49 = Deutschland)

[exclude]
# Zeilen mit einer Adresse auf einer dieser Domains (Subdomains eingeschlossen) werden beiseitegelegt.
internal_domains = ["example.org"]
# Einzelne interne Adressen, die keine Domain abdeckt.
internal_emails = ["support@example.com", "billing@example.com"]
# Reguläre Ausdrücke (ohne Unterscheidung von Groß- und Kleinschreibung) für Name, Firma und E-Mail.
test_patterns = [
  '\btest\b',
  '\btest\d*@',
  '\bmustermann\b',
  '\bdummy\b',
]

# Ein [[source]]-Block je Dateiaufbau. `match` ist ein Muster für den Dateinamen.
# Links: das Feld, das die Pipeline kennt. Rechts: die Spaltenüberschrift in der Datei.
# Verwenden Sie `name` oder `first_name` und `last_name`.

[[source]]
match = "crm_export_a*.csv"
delimiter = ","
encoding = "utf-8-sig"
[source.columns]
id = "Contact ID"
name = "Full Name"
email = "Email"
phone = "Phone"
company = "Company"
city = "City"
created = "Created"

[[source]]
match = "crm_export_b*.csv"
delimiter = ","
encoding = "utf-8-sig"
[source.columns]
id = "Kontakt-Nr"
first_name = "Vorname"
last_name = "Nachname"
email = "E-Mail"
phone = "Telefon"
phone_2 = "Mobil"
company = "Firma"
city = "Ort"
created = "Erstellt am"
